# 예약 발행 — 10분마다 "나갈 때가 된 글"이 있는지 보고, 있으면 사이트를 다시 빌드한다.
# 수동 실행도 가능하다 (Actions 탭 → Run workflow).
#
# ⚠️ GitHub 은 60일간 커밋이 없는 저장소의 schedule 을 자동 중지한다.
#    블로그는 계속 커밋되므로 보통 문제없지만, 오래 쉬었다면 Actions 탭에서 다시 켜야 한다.
name: 예약 발행 체크

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 예약 시각이 지난 글이 사이트에 반영됐는지 확인
        run: node scripts/check-scheduled.mjs
        env:
          SITE_URL: https://outvest.kr
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}

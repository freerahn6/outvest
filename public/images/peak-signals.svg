<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="반도체 고점 판별의 두 접근 대비 개념도">
<title>반도체 고점 판별의 두 접근 대비 개념도</title><desc>왼쪽은 '주가 하락(셀온)'과 '반도체 고점'이 서로를 근거로 삼는 닫힌 순환 논증을 보여주고, 오른쪽은 ①현물가·고정거래가 상승 ②재고(DIO) 타이트 ③가동률·CAPEX 주의 ④HBM 수급 타이트 ⑤AI 수요 급증이라는 5개 독립 신호로 사이클 국면을 판별하는 신호판을 보여준다. CAPEX만 주의(노랑), 나머지는 확장 국면(녹색).</desc>
<style>
  :root{
    --surface:#fcfcfb; --ink:#0b0b0b; --sub:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a;
    --red:#e34948; --green:#008300; --mute:#b7d3f6;
  }
  @media (prefers-color-scheme:dark){
    :root{ --surface:#1a1a19; --ink:#ffffff; --sub:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --blue:#3987e5; --orange:#d95926; --aqua:#199e70;
      --red:#e66767; --green:#31a531; --mute:#2f4b6e; }
  }
  .bg{fill:var(--surface)}
  .title{fill:var(--ink);font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif}
  .sub{fill:var(--sub);font:400 13px system-ui,sans-serif}
  .lbl{fill:var(--ink);font:600 14px system-ui,sans-serif}
  .ax{fill:var(--muted);font:500 13px system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .val{fill:var(--ink);font:700 15px system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .grid{stroke:var(--grid);stroke-width:1}
  .base{stroke:var(--axis);stroke-width:1.5}
  .s-blue{fill:var(--blue)} .s-orange{fill:var(--orange)} .s-aqua{fill:var(--aqua)}
  .s-red{fill:var(--red)} .s-green{fill:var(--green)} .s-mute{fill:var(--mute)}
  .refline{stroke:var(--orange);stroke-width:1.5;stroke-dasharray:5 4}
  .nowline{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
</style>
<rect class="bg" x="0" y="0" width="800" height="470" rx="14"/>
<text class="title" x="24" y="34">반도체 '고점'은 어떻게 판별하나</text><text class="sub" x="24" y="56">주가로 고점을 말하면 순환 논증(왼쪽). 고점은 밸류체인 위 독립 신호로 판별한다(오른쪽).</text><rect x="24" y="84" width="366" height="362" rx="12" fill="var(--red)" opacity="0.06"/><rect x="24" y="84" width="366" height="362" rx="12" fill="none" stroke="var(--axis)" stroke-width="1"/><text class="lbl" x="207" y="114" text-anchor="middle" style="fill:var(--red)">순환 논증 (X)</text><rect x="68" y="154" width="278" height="60" rx="10" fill="var(--surface)" stroke="var(--red)" stroke-width="1.5"/><text class="lbl" x="207" y="189" text-anchor="middle">주가 하락 (셀온)</text><rect x="68" y="346" width="278" height="60" rx="10" fill="var(--surface)" stroke="var(--red)" stroke-width="1.5"/><text class="lbl" x="207" y="381" text-anchor="middle">반도체 고점</text><path d="M346 220 C 386 238, 386 322, 346 340" fill="none" stroke="var(--red)" stroke-width="2"/><polygon points="340,330 352,330 346,342" fill="var(--red)"/><path d="M68 340 C 28 322, 28 238, 68 220" fill="none" stroke="var(--red)" stroke-width="2"/><polygon points="62,230 74,230 68,218" fill="var(--red)"/><text x="207" y="284" text-anchor="middle" style="fill:var(--red);font:700 34px system-ui;opacity:0.55">↻</text><text class="sub" x="207" y="306" text-anchor="middle" style="fill:var(--red)">닫힌 순환 = 동어반복</text><rect x="410" y="84" width="366" height="362" rx="12" fill="var(--green)" opacity="0.06"/><rect x="410" y="84" width="366" height="362" rx="12" fill="none" stroke="var(--axis)" stroke-width="1"/><text class="lbl" x="593" y="114" text-anchor="middle" style="fill:var(--green)">독립 신호 판별 (O)</text><circle cx="440" cy="156" r="15" fill="var(--surface)" stroke="var(--axis)" stroke-width="1"/><text class="lbl" x="440" y="161" text-anchor="middle">①</text><text class="lbl" x="466" y="160" >현물가·고정거래가</text><text class="val" x="758" y="160" text-anchor="end" style="fill:var(--green)">↑ 상승</text><circle cx="440" cy="220" r="15" fill="var(--surface)" stroke="var(--axis)" stroke-width="1"/><text class="lbl" x="440" y="225" text-anchor="middle">②</text><text class="lbl" x="466" y="224" >재고(DIO)</text><text class="val" x="758" y="224" text-anchor="end" style="fill:var(--green)">↓ 타이트</text><circle cx="440" cy="284" r="15" fill="var(--surface)" stroke="var(--axis)" stroke-width="1"/><text class="lbl" x="440" y="289" text-anchor="middle">③</text><text class="lbl" x="466" y="288" >가동률·CAPEX</text><text class="val" x="758" y="288" text-anchor="end" style="fill:var(--orange)">↑ 주의</text><circle cx="440" cy="348" r="15" fill="var(--surface)" stroke="var(--axis)" stroke-width="1"/><text class="lbl" x="440" y="353" text-anchor="middle">④</text><text class="lbl" x="466" y="352" >HBM 수급</text><text class="val" x="758" y="352" text-anchor="end" style="fill:var(--green)">↑ 타이트</text><circle cx="440" cy="412" r="15" fill="var(--surface)" stroke="var(--axis)" stroke-width="1"/><text class="lbl" x="440" y="417" text-anchor="middle">⑤</text><text class="lbl" x="466" y="416" >AI 수요</text><text class="val" x="758" y="416" text-anchor="end" style="fill:var(--green)">↑ 급증</text><text class="sub" x="428" y="432">③ CAPEX만 '주의'(양날의 칼) · 나머지는 확장 국면</text>
</svg>
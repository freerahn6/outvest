<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="2026년 7월 30일 서울과 뉴욕의 등락률 비교 막대그래프">
<title>2026년 7월 30일 — 같은 재료, 갈라진 두 시장</title><desc>같은 날 서울에서는 SK하이닉스 본주가 -5.64%, 코스피가 -1.23% 하락했지만, 그날 밤 뉴욕에서는 필라델피아 반도체지수가 +8.19%, SK하이닉스 ADR이 +17.52%, 마이크론이 약 +18.4% 상승했다.</desc>
<style>
  :root{
    --surface:#fcfcfb; --ink:#0b0b0b; --sub:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --blue:#2a78d6; --orange:#eb6834;
    --red:#e34948; --green:#008300; --mute:#b7d3f6;
  }
  @media (prefers-color-scheme:dark){
    :root{ --surface:#1a1a19; --ink:#ffffff; --sub:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --blue:#3987e5; --orange:#d95926;
      --red:#e66767; --green:#31a531; --mute:#2f4b6e; }
  }
  .bg{fill:var(--surface)}
  .title{fill:var(--ink);font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif}
  .sub{fill:var(--sub);font:400 13px system-ui,sans-serif}
  .lbl{fill:var(--ink);font:600 13px system-ui,sans-serif}
  .lbl2{fill:var(--muted);font:500 12px system-ui,sans-serif}
  .ax{fill:var(--muted);font:500 12px system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .val{fill:var(--ink);font:700 15px system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .zonelbl{fill:var(--muted);font:700 12px system-ui,sans-serif;letter-spacing:1px}
  .grid{stroke:var(--grid);stroke-width:1}
  .base{stroke:var(--axis);stroke-width:1.5}
  .divide{stroke:var(--axis);stroke-width:1;stroke-dasharray:5 4}
  .s-red{fill:var(--red)} .s-green{fill:var(--green)} .s-mute{fill:var(--mute)}
</style>

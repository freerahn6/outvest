<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="샌프란시스코 AI 동맹의 숨은 수혜 밸류체인">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3fa05e" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#3fa05e" stop-opacity="0.02"/>
  </linearGradient>
</defs>
<style>
  .bg{fill:#f5f8f6} .blob{fill:#3fa05e;opacity:0.10}
  .eye{fill:#2f8f57;font:700 27px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:1px}
  .ttl{fill:#1b1d20;font:800 64px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-2px}
  .sub{fill:#4a4f4b;font:600 30px system-ui,sans-serif;letter-spacing:-0.5px}
  .brand{fill:#8a8f8b;font:600 24px system-ui,sans-serif}
  .chip{fill:none;stroke:#3fa05e;stroke-width:2}
  .chiptx{fill:#2f8f57;font:700 22px system-ui,sans-serif}
  .layer{fill:#3fa05e}
</style>
<rect class="bg" width="1200" height="675"/>
<circle class="blob" cx="1040" cy="130" r="250"/>
<path d="M0 560 L1200 470 L1200 675 L0 675 Z" fill="url(#g)"/>
<!-- 오른쪽: 4개 층 스택 모티프 -->
<g transform="translate(915,150)" opacity="0.9">
  <rect class="layer" x="0" y="0" width="210" height="34" rx="6" opacity="0.85"/>
  <rect class="layer" x="18" y="48" width="192" height="34" rx="6" opacity="0.6"/>
  <rect class="layer" x="36" y="96" width="174" height="34" rx="6" opacity="0.4"/>
  <rect class="layer" x="54" y="144" width="156" height="34" rx="6" opacity="0.25"/>
</g>
<text x="80" y="132" class="eye">샌프란시스코 AI 선언</text>
<text x="80" y="300" class="ttl">카메라 밖,</text><text x="80" y="382" class="ttl">전력은 누가 대나</text>
<text x="80" y="452" class="sub">4대 그룹 뒤 '숨은 수혜' 4개 층</text>
<rect class="chip" x="80" y="556" width="290" height="46" rx="23"/>
<text x="104" y="587" class="chiptx">전력·냉각·소재·기판</text>
<text x="1120" y="628" text-anchor="end" class="brand">아웃베스트의 투자로그</text>
</svg>
